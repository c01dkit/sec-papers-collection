<!DOCTYPE html><html lang="zh-CN" data-theme="light" data-accent="slate" data-fontsize="large" data-pagewidth="medium" data-astro-cid-z4jru4n3><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>论文摘要 · 论文辑录</title><meta name="description" content="IEEE S&amp;P、USENIX Security、ACM CCS、NDSS 等 10 个顶级会议的论文检索、录用趋势、摘要、获奖与投稿时间线。"><link rel="icon" href="/favicon.ico"><link rel="alternate" hreflang="zh-CN" href="https://sec.c01dkit.com/zh/abstract/"><link rel="alternate" hreflang="en" href="https://sec.c01dkit.com/en/abstract/"><meta name="astro-view-transitions-enabled" content="true"><meta name="astro-view-transitions-fallback" content="animate"><script type="module" src="/_astro/ClientRouter.astro_astro_type_script_index_0_lang.aQfDf-Kh.js"></script><script>
      // 首绘前同步定主题：必须 is:inline，打包成 module 会 defer 从而闪一下默认主题。
      // 数据源是 localStorage（同步），IndexedDB 是异步的、来不及。
      (function () {
        var d = document.documentElement;
        var ACCENTS = ['slate', 'indigo', 'oxblood', 'pine'];
        var g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };

        // remember 关闭时忽略上次选择，跟随系统偏好
        var t = g('spc-remember-dark') === '0' ? null : g('spc-theme');
        d.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

        var a = g('spc-remember-accent') === '0' ? null : g('spc-accent');
        d.dataset.accent = ACCENTS.indexOf(a) >= 0 ? a : 'slate';

        // 字号与版心宽度没有 remember 开关：设置页选了就一直生效。
        // 回落值必须与 DEFAULT_SETTINGS 一致（字号默认 large、版心默认 medium），
        // 否则首访（尚无镜像）会先绘出另一档、水合后再跳一下。
        var FS = ['small', 'medium', 'large'];
        var f = g('spc-fontsize');
        d.dataset.fontsize = FS.indexOf(f) >= 0 ? f : 'large';

        var PW = ['narrow', 'medium', 'wide', 'full'];
        var w = g('spc-pagewidth');
        d.dataset.pagewidth = PW.indexOf(w) >= 0 ? w : 'medium';

        // 只有允许动效时才开启 reveal 门控，否则内容保持默认可见
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('reveal-on');

          // 门控是这里加的（内联、同步，为的是不闪一下全可见的内容），
          // 但解除门控的 .in 是 bundle 里的 reveal.js 加的。两者之间必须有个
          // 保险，否则「内联跑了、bundle 没到」就等于整页停在 opacity:0 ——
          // 实测（真实 Chrome，abort /_astro/*.js）首页 38/38 个 [data-reveal]
          // opacity 全 0、h1 也是 0，而 body.innerText 有 2,698 个字符。
          // 「无 JS」那条路本来就没问题（内联根本不跑，门控就不存在），
          // 之前防的是错的那一头。
          //
          // 用 window load 而不是固定延时：实测它就是「所有子资源尘埃落定」——
          // bundle 被 abort 时 160ms 就触发，bundle 被人为拖慢 1,800ms 时它等到
          // 1,827ms 才触发（和 astro:page-load 同一毫秒）。所以它既不会在健康
          // 加载上误触，也不会在失败时干等。再留 500ms 余量给同一毫秒内的
          // 派发顺序，安全系数约 500 倍。
          //
          // 万一余量仍不够（极端情况下 astro:page-load 落在 load+500ms 之后），
          // 代价只是这一次没有淡入动画 —— 与开了「减少动效」的用户看到的完全
          // 一样。反过来漏掉这个保险的代价是内容永远不出现。方向选对了。
          window.addEventListener('load', function () {
            setTimeout(function () {
              if (!window.__spcRevealReady) d.classList.remove('reveal-on');
            }, 500);
          });
        }

        try {
          var cur = location.pathname.match(/^\/(zh|en)\//);
          if (cur) localStorage.setItem('spc-lang', cur[1]);
        } catch (e) {}
      })();

      // 软导航换入新 document 时把主题状态带过去，否则每次跳转都闪回默认值
      document.addEventListener('astro:before-swap', function (e) {
        var cur = document.documentElement;
        var nxt = e.newDocument.documentElement;
        nxt.dataset.theme = cur.dataset.theme;
        nxt.dataset.accent = cur.dataset.accent;
        nxt.dataset.fontsize = cur.dataset.fontsize;
        nxt.dataset.pagewidth = cur.dataset.pagewidth;
        if (cur.classList.contains('reveal-on')) nxt.classList.add('reveal-on');
      });
    </script><noscript><style>
        /* global.css 收掉了原生页面滚动条，改由 #pageSb 那条悬浮滑块顶上 ——
           而画那条滑块的是 JS。没有 JS 时两头落空：页面只剩滚轮和键盘能滚，
           且没有任何「现在在第几屏、一共多少屏」的指示。所以把原生的还回去。
           这么一来无 JS 用户会重新遇到「有无滚动条导致版心左右跳」的老问题，

           scrollbar-width 与 ::-webkit-scrollbar 两条都要写 —— Chrome/Firefox

        html { scrollbar-width: auto !important; }
        html::-webkit-scrollbar { display: block !important; }
        /* 那条永远不会被画出来的滑块，别留在文档里吃指针 */
